<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TORRE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header id="header">

    <div id="menu-wrapper">
      <button id="torre-title" type="button">log/torre</button>
      <nav id="category-menu"></nav>
    </div>

    <a
      id="lab-title"
      href="https://laia.pt/TORRE"
      target="_blank"
      rel="noopener noreferrer"
    >
      LABORATÓRIO DA TORRE
    </a>

  </header>


  <main id="archive">

    <h1 id="category-title"></h1>

    <div id="grid-wrapper">

      <div id="grid"></div>

      <!-- Controlos das colunas -->
      <div id="column-controls">
        <button id="add-column" type="button">+ column</button>
        <button id="remove-column" type="button">− column</button>
      </div>

    </div>


    <!-- Controlos das rows -->
    <div id="row-controls">
      <button id="add-row" type="button">+ row</button>
      <button id="remove-row" type="button">− row</button>
    </div>

  </main>


  <div id="image-viewer" aria-hidden="true">
    <img id="viewer-image" src="" alt="">
  </div>


  <!-- Input invisível usado para abrir o Finder -->
  <input
    id="image-file-input"
    type="file"
    accept="image/*"
    hidden
  >


  <script src="script.js"></script>

</body>
</html>
