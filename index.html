<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TORRE</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <header id="header">

    <div id="menu-wrapper">

      <button
        id="torre-title"
        type="button"
      >
        log/torre
      </button>

      <nav id="category-menu"></nav>

    </div>


    <a
      id="lab-title"
      href="https://laia.pt/TORRE"
      target="_blank"
      rel="noopener noreferrer"
    >
      LABORATÓRIO DA TORRE
    </a>

  </header>


  <main id="archive">


    <h1 id="category-title"></h1>


    <div id="grid-wrapper">

      <div id="grid"></div>


      <!-- CONTROLOS DAS COLUNAS -->

      <div id="column-controls">

        <button
          id="add-column"
          type="button"
        >
          + column
        </button>

        <button
          id="remove-column"
          type="button"
        >
          − column
        </button>

      </div>

    </div>


    <!-- CONTROLOS DAS LINHAS -->

    <div id="row-controls">

      <button
        id="add-row"
        type="button"
      >
        + row
      </button>

      <button
        id="remove-row"
        type="button"
      >
        − row
      </button>

    </div>


  </main>


  <!-- =====================================================
       CHAT / LOG
  ====================================================== -->

  <section id="log-panel">

    <div id="log-header">

      <span>log</span>

      <button
        id="toggle-log"
        type="button"
      >
        −
      </button>

    </div>


    <div id="log-content">


      <div id="log-list"></div>


      <form id="log-form">


        <div class="log-field">

          <label for="log-date">
            data
          </label>

          <input
            id="log-date"
            type="date"
            required
          >

        </div>


        <div class="log-field">

          <label for="log-number">
            nº
          </label>

          <input
            id="log-number"
            type="number"
            min="1"
            required
          >

        </div>


        <div class="log-field log-note">

          <label for="log-note">
            nota
          </label>

          <textarea
            id="log-note"
            rows="2"
            required
            placeholder="adicionar nota..."
          ></textarea>

        </div>


        <button
          id="save-log"
          type="submit"
        >
          +
        </button>


      </form>


    </div>

  </section>


  <!-- =====================================================
       IMAGE VIEWER
  ====================================================== -->

  <div
    id="image-viewer"
    aria-hidden="true"
  >

    <img
      id="viewer-image"
      src=""
      alt=""
    >

  </div>


  <!-- FINDER -->

  <input
    id="image-file-input"
    type="file"
    accept="image/*"
    hidden
  >


  <script src="script.js"></script>

</body>

</html>
